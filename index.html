<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1ea" />
    <title>ZenPost Pocket Studio</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              zenbg: '#f5f1ea',
              zenpaper: '#f9f6f0',
              zenline: '#ece6dc',
              zenmuted: '#938a7b'
            },
            fontFamily: {
              inter: ['IBM Plex Mono', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'monospace'],
              logo: ['Cormorant Garamond', 'Times New Roman', 'serif']
            }
          }
        }
      }
    </script>
    <style>
      html,
      body {
        min-height: 100dvh;
        -webkit-text-size-adjust: 100%;
      }
      .min-h-screen {
        min-height: 100dvh !important;
      }
      input,
      textarea,
      select {
        font-size: inherit;
      }
      @supports (-webkit-touch-callout: none) {
        input,
        textarea,
        select {
          font-size: 16px !important;
        }
      }
      html.keyboard-open [data-app-footer="true"] {
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
      }
    </style>
  </head>
  <body class="bg-zenbg font-inter text-[#171717]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
